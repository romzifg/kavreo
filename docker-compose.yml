# PostgreSQL lokal untuk development
# Jalankan: docker compose up -d
services:
  db:
    image: postgres:17-alpine
    container_name: content-planner-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: content_planner
    ports:
      - "5432:5432"
    volumes:
      - content_planner_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d content_planner"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  content_planner_data:
