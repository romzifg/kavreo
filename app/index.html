<!doctype html>
<html lang="id" data-theme="planner">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
		<meta name="theme-color" content="#6d5efc" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-title" content="Kavreo" />
		<meta name="apple-mobile-web-app-status-bar-style" content="default" />
		<link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
		<meta name="description" content="Kavreo — ruang kreatif untuk ide konten, script video, kalender tayang, dan kolaborasi tim kreator." />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
		<title>Kavreo — Creator Workspace</title>
		<script>
			// Terapkan tema tersimpan sebelum render agar tidak berkedip
			try {
				var t = JSON.parse(localStorage.getItem("cp-ui") || "{}").state?.theme;
				if (t) document.documentElement.setAttribute("data-theme", t);
			} catch (e) {}
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
